<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Document</title>

</head>

<body class="container-fluid">


    <div id="templates">
        <template id="table-template">
            <tr id="template-tr">
                <td class="table-fields"></td>
                <td class="table-fields"></td>
                <td class="table-fields"></td>
                <td class="table-fields"></td>
                <td class="table-fields"></td>
                <td class="table-fields"></td>
                <td class="table-fields"></td>
            </tr>
        </template>
    </div>

    <section class="row">
        <div class="col">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">Név</th>
                        <th scope="col">Email</th>
                        <th scope="col">City</th>
                        <th scope="col">Telefon</th>
                        <th scope="col">Szerepkör</th>
                        <th scope="col">Módosítás</th>
                        <th scope="col">Törlés</th>
                    </tr>
                </thead>
                <tbody id="target-tbody">

                </tbody>
            </table>
        </div>
    </section>


    <section class="row">
        <div class="col-2 col-lg-3" ></div>
        <div class="col-8 col-lg-6">
            <div>
                <label for="sizesInputDefault" class="form-label">Név</label>
                <input class="form-control" type="text" id="name-input" placeholder="Név"
                    aria-label="Default input example">
            </div>
            <div>
                <label for="sizesInputDefault" class="form-label">Email</label>
                <input class="form-control" type="text" id="email-input" placeholder="Email"
                    aria-label="Default input example">
            </div>
            <div>
                <label for="sizesInputDefault" class="form-label">Város</label>
                <input class="form-control" type="text" id="city-input" placeholder="Város"
                    aria-label="Default input example">
            </div>
            <div>
                <label for="sizesInputDefault" class="form-label">Telefon</label>
                <input class="form-control" type="text" id="phone-input" placeholder="Telefon"
                    aria-label="Default input example">
            </div>
            <div>
                <label for="sizesSelectDefault" class="form-label">Szerepkör</label>
                <select class="form-control" id="role-input">
                    <option value="1">Vásárló</option>
                    <option value="2">Eladó</option>
                    <option value="3">Admin</option>
                </select>
            </div>
            <button type="button" id="add-user" class="btn-solid theme-primary">Hozzáad</button>
        </div>
        <div class="col-2 col-lg-3"></div>
    </section>





    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>

    <script src="main.js"></script>
</body>

</html>
